<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>מסנן תוכן</title>
    <link rel="stylesheet" href="../ui/ui.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
        <path d="m9 12 2 2 4-4" />
      </svg>
      <h1>מסנן תוכן</h1>
    </div>

    <div class="row">
      <span class="name" title="כיבוי מלא של הסינון בכל האתרים">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
        סינון פעיל
      </span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </label>
    </div>

    <div class="row">
      <span class="name" id="site-label" title="כיבוי הסינון באתר הנוכחי בלבד">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
        האתר הנוכחי
      </span>
      <label class="switch">
        <input type="checkbox" id="site-allowed" />
        <span class="track"></span>
      </label>
    </div>

    <div class="stats">
      <div title="כמה תמונות נבדקו מאז ההתקנה">
        <strong id="stat-scanned">0</strong><span>נבדקו</span>
      </div>
      <div title="כמה תמונות הוסתרו">
        <strong id="stat-blocked">0</strong><span>הוסתרו</span>
      </div>
      <div title="כמה עמודים נחסמו במלואם">
        <strong id="stat-pages">0</strong><span>עמודים</span>
      </div>
    </div>

    <div class="status">
      <span class="dot" id="model-dot"></span>
      <span id="model-text">בודק את מנוע הזיהוי…</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="open-options" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        הגדרות
      </button>
      <button class="btn btn-ghost" id="reload" type="button" title="רענון העמוד כדי להחיל את השינוי">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
        רענון
      </button>
    </div>

    <footer id="footer"></footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
